<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Papan Gangguan Sarana – KAI Commuter</title>
</head>
<body>
  <div id="loading" style="font-family:Arial,sans-serif;padding:30px">Memuat aplikasi...</div>
  <script>
    (async()=>{
      const base='https://raw.githubusercontent.com/shandishantoro-rgb/Gangguan-Sarana/05b47c971d18bb14e34802a75d018aab1dcb2089/index.html';
      const patch='https://raw.githubusercontent.com/shandishantoro-rgb/Gangguan-Sarana/main/patch.js';
      const OLD_API='https://script.google.com/macros/s/AKfycbwAA7Z4FnjQPllYt-_w7d6NQ7HGkVBSGHZqNlUjNNvB_B03yvAMyBhIHevd2qGoOJA/exec';
      const NEW_API='https://script.google.com/macros/s/AKfycbzVmjLNsjRTSo6o3gtuGn_3pODvQ35ZQAluMyHZPJw1o_Xi4x4ERWRnNM0tJdY_Hm/exec';
      try{
        let html=await (await fetch(base,{cache:'no-store'})).text();
        html=html.replaceAll(OLD_API,NEW_API);

        html=html.replace(
          `if (role === "admin") {
                $("#btnBaru").style.display = "block";
                $("#btnSimpan").style.display = "block";
                $("#btnDbCsv").style.display = "inline-flex";
            } else {
                $("#btnBaru").style.display = "none";
                $("#btnSimpan").style.display = "none";
                $("#btnDbCsv").style.display = "none";
            }`,
          `if (role === "admin") {
                $("#btnBaru").style.display = "block";
                $("#btnSimpan").style.display = "block";
                $("#btnDbCsv").style.display = "inline-flex";
            } else {
                $("#btnBaru").style.display = "block";
                $("#btnSimpan").style.display = "block";
                $("#btnDbCsv").style.display = "none";
            }`
        );

        html=html.replace(
          `if (userRole !== "admin") { beritahu("Hanya admin yang dapat mengedit."); return; }
            sunting = r ? r[KOLOM.id] : null;`,
          `if (userRole !== "admin" && r) { beritahu("User hanya dapat membuat laporan baru."); return; }
            sunting = r ? r[KOLOM.id] : null;`
        );

        html=html.replace(
          `if(userRole!=="admin"){beritahu("Hanya admin yang dapat menyimpan.");return;}
  const data=ambilForm();`,
          `if(userRole!=="admin" && sunting){beritahu("User hanya dapat membuat laporan baru.");return;}
  const data=ambilForm();`
        );

        html=html.replace('document.addEventListener("DOMContentLoaded", () => {','document.addEventListener("DOMContentLoaded", async () => {');
        html=html.replace(/\s+\/\/ Demo data[\s\S]+?\n\s+await muatUI\(\);\n/,'\n            await muatUI();\n');

        let js=await (await fetch(patch,{cache:'no-store'})).text();
        js=js.replace(
          'if(userRole!=="admin"){beritahu("Hanya admin yang dapat menyimpan.");return;}',
          'if(userRole!=="admin" && sunting){beritahu("User hanya dapat membuat laporan baru.");return;}'
        );

        const enforceUserButtons = `
<script>
(function enforceReportActions(){
  const timer=setInterval(function(){
    const roleLabel=document.querySelector('#sidebarUserRole');
    const btnBaru=document.querySelector('#btnBaru');
    const btnSimpan=document.querySelector('#btnSimpan');
    if(!roleLabel||!btnBaru||!btnSimpan) return;
    const role=(roleLabel.textContent||'').trim().toLowerCase();
    if(role==='user'){
      btnBaru.style.display='block';
      btnSimpan.style.display='block';
    }
  },250);
  setTimeout(function(){clearInterval(timer);},1800000);
})();
</script>`;

        html=html.replace('</body>', '<script>'+js+'</scr'+'ipt>'+enforceUserButtons+'</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(e){
        console.error(e);
        document.getElementById('loading').textContent='Gagal memuat aplikasi: '+e.message;
      }
    })();
  </script>
</body>
</html>
