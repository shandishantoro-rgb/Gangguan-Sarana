<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papan Gangguan Sarana — KAI Commuter</title></head>
<body>
<div id="loading" style="font-family:Arial,sans-serif;padding:30px">Memuat aplikasi…</div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/shandishantoro-rgb/Gangguan-Sarana/7bd7aa100e0b82bde718e97a69d0f04c90824914/index.html';
  const patch='https://raw.githubusercontent.com/shandishantoro-rgb/Gangguan-Sarana/main/patch.js';
  try{
    const html=await (await fetch(base,{cache:'no-store'})).text();
    const js=await (await fetch(patch,{cache:'no-store'})).text();
    const merged=html.replace('</body>','<script>'+js+'</script></body>');
    document.open();document.write(merged);document.close();
  }catch(e){document.getElementById('loading').textContent='Gagal memuat aplikasi: '+e.message;}
})();
</script>
</body>
</html>
