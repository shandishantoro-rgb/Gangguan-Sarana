<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gangguan Sarana — KAI Commuter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="login" class="login-screen"><div class="login-card"><div class="brand">KAI COMMUTER</div><div class="subtitle">Papan Gangguan Sarana</div><div class="role-switch"><label><input type="radio" name="role" value="user" checked> User</label><label><input type="radio" name="role" value="admin"> Admin</label></div><div class="field"><label id="nameLabel">Nama Pengguna</label><input id="loginName" autocomplete="username"></div><div class="field hidden" id="passWrap"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary full" id="loginBtn">Masuk</button><div id="loginErr" class="error hidden"></div></div></section>
<section id="app" class="app-screen hidden"><header class="topbar"><div class="title">Gangguan Sarana</div><div class="grow"></div><div id="userText" class="user-info"></div><button class="btn" id="logoutBtn">Keluar</button></header><div class="layout"><aside class="sidebar"><button class="nav-item active" data-view="dash">Dashboard</button><button class="nav-item" data-view="data">Database</button></aside><main class="content"><section id="viewDash" class="view"><div class="section-head"><div><h1>Dashboard</h1><p class="muted">Ringkasan gangguan dari Google Sheets</p></div><div class="grow"></div><button class="btn primary" id="newBtn">+ Buat Laporan</button></div><div class="metric-grid"><div class="card metric"><div class="label">Total Gangguan</div><div class="value" id="mTotal">0</div></div><div class="card metric"><div class="label">Terbuka</div><div class="value" id="mOpen">0</div></div><div class="card metric"><div class="label">Penanganan</div><div class="value" id="mProcess">0</div></div><div class="card metric"><div class="label">Selesai</div><div class="value" id="mDone">0</div></div></div><div class="card section-card"><div class="section-head"><h2>Gangguan Terbaru</h2><div class="grow"></div><button class="btn" id="refreshBtn">Muat Ulang</button></div><div id="dashTable"></div></div></section><section id="viewData" class="view hidden"><div class="section-head"><div><h1>Database Gangguan</h1><p class="muted">Data langsung dari Google Sheets</p></div><div class="grow"></div><button class="btn primary" id="newBtn2">+ Buat Laporan</button></div><div class="card section-card"><div class="toolbar"><input id="search" class="search" placeholder="Cari No KA, trainset, lokasi..."><select id="statusFilter"><option value="">Semua status</option><option>Terbuka</option><option>Penanganan</option><option>Selesai</option></select></div><div id="dataTable"></div></div></section></main></div></section>
<div id="drawerOverlay" class="drawer-overlay hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawer-head"><div><h2 id="formTitle">Laporan Baru</h2><p class="muted">Input gangguan sarana</p></div><div class="grow"></div><button id="closeBtn" class="btn">Tutup</button></div><div class="form-grid"><div class="field"><label>Tanggal</label><input id="fDate" type="date"></div><div class="field"><label>Jam</label><input id="fTime" type="time"></div><div class="field"><label>No KA</label><input id="fKa"></div><div class="field"><label>Relasi</label><input id="fRelasi"></div><div class="field"><label>Trainset</label><input id="fTrainset"></div><div class="field"><label>SF</label><select id="fSf"><option>8</option><option>10</option><option>12</option></select></div><div class="field"><label>Posisi Kereta</label><input id="fPosisi"></div><div class="field"><label>Lokasi</label><input id="fLokasi"></div><div class="field"><label>Kategori Gangguan</label><input id="fKategori"></div><div class="field"><label>Dampak</label><input id="fDampak"></div><div class="field"><label>Keterlambatan (menit)</label><input id="fTelat" type="number" min="0" value="0"></div><div class="field"><label>Dipo</label><input id="fDipo"></div><div class="field span-2"><label>Uraian Gangguan</label><textarea id="fUraian"></textarea></div><div class="field span-2"><label>Tindakan</label><textarea id="fTindakan"></textarea></div><div class="field"><label>Status</label><select id="fStatus"><option>Terbuka</option><option>Penanganan</option><option>Selesai</option></select></div><div class="field"><label>Pelapor</label><input id="fPelapor"></div></div><div class="drawer-actions"><button id="cancelBtn" class="btn">Batal</button><button id="saveBtn" class="btn primary">Simpan</button></div></aside><div id="toast" class="toast"></div>
<script src="js/app.js" defer></script>
</body>
</html>
