<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTC — Train Traffic Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>TTC — Train Traffic Simulator</h1>
    <p class="subtitle">Tahap 1 — Data Jaringan Lintas</p>
  </header>

  <div class="toolbar">
    <button id="btn-baru">Proyek Baru</button>
    <button id="btn-contoh">Muat 5 Stasiun Contoh</button>
    <button id="btn-simpan" class="primary">Simpan Proyek</button>
    <label class="file-label" for="file-buka">Buka Proyek</label>
    <input id="file-buka" type="file" accept=".json,application/json">
  </div>

  <main>
    <section class="panel" style="margin-bottom:18px">
      <div class="field">
        <label for="nama-proyek">Nama Proyek</label>
        <input id="nama-proyek" type="text" value="Proyek TTC">
      </div>
      <div class="summary">
        <span id="jumlah-stasiun" class="badge">0 stasiun</span>
        <span id="jumlah-petak" class="badge">0 petak</span>
      </div>
      <div id="status" class="status" role="status"></div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Stasiun</h2>
        <form id="form-stasiun" class="form-grid">
          <div class="field">
            <label for="st-kode">Kode</label>
            <input id="st-kode" type="text" maxlength="8" placeholder="BOO" required>
          </div>
          <div class="field">
            <label for="st-nama">Nama</label>
            <input id="st-nama" type="text" placeholder="Bogor" required>
          </div>
          <div class="field">
            <label for="st-km">Km</label>
            <input id="st-km" type="number" step="0.001" placeholder="0" required>
          </div>
          <div class="field">
            <label for="st-jalur">Jumlah Jalur</label>
            <input id="st-jalur" type="number" min="1" step="1" value="2" required>
          </div>
          <div class="field full">
            <label for="st-jenis">Jenis</label>
            <select id="st-jenis">
              <option>Stasiun</option>
              <option>Perhentian</option>
            </select>
          </div>
          <div class="actions">
            <button type="submit" class="primary">Tambah Stasiun</button>
          </div>
        </form>
        <div id="daftar-stasiun" class="list"></div>
      </section>

      <section class="panel">
        <h2>Petak Jalan</h2>
        <form id="form-petak" class="form-grid">
          <div class="field">
            <label for="petak-dari">Dari</label>
            <select id="petak-dari" required></select>
          </div>
          <div class="field">
            <label for="petak-ke">Ke</label>
            <select id="petak-ke" required></select>
          </div>
          <div class="field">
            <label for="petak-jarak">Jarak (km)</label>
            <input id="petak-jarak" type="number" min="0.001" step="0.001" required>
          </div>
          <div class="field">
            <label for="petak-jenis">Jenis Jalur</label>
            <select id="petak-jenis">
              <option value="Tunggal">Lintas Tunggal</option>
              <option value="Ganda">Lintas Ganda</option>
            </select>
          </div>
          <div class="field full">
            <label for="petak-vmax">Kecepatan Maksimum (km/jam)</label>
            <input id="petak-vmax" type="number" min="1" step="1" placeholder="70" required>
          </div>
          <div class="actions">
            <button type="submit" class="primary">Tambah Petak Jalan</button>
          </div>
        </form>
        <div id="daftar-petak" class="list"></div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
